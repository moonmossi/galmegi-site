<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발일지 글쓰기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background: #1b1a19; color: #ddd6cc; font-size: 15px;
  }
  .pane { height: 100vh; overflow-y: auto; }
  .form { width: 46%; min-width: 380px; padding: 24px 26px 80px; border-right: 1px solid #33302c; }
  .preview { flex: 1; background: #0d0c0b; }
  .preview iframe { width: 100%; height: 100%; border: 0; display: block; }

  h1 { font-size: 17px; letter-spacing: .06em; margin: 0 0 4px; }
  .hint { font-size: 13px; color: #8b837a; margin: 0 0 22px; line-height: 1.6; }

  label { display: block; font-size: 13px; color: #8b837a; margin: 16px 0 5px; }
  input[type=text], input[type=date], textarea {
    width: 100%; padding: 9px 11px; font: inherit;
    color: #ece5da; background: #232120; border: 1px solid #3b3733; border-radius: 4px;
  }
  input:focus, textarea:focus { outline: none; border-color: #c8452f; }
  textarea { min-height: 190px; resize: vertical; line-height: 1.7; }

  .drop {
    margin-top: 8px; padding: 26px; text-align: center; font-size: 14px; color: #8b837a;
    border: 1px dashed #4a453f; border-radius: 6px; background: #201e1d; cursor: pointer;
  }
  .drop.over { border-color: #c8452f; color: #ddd6cc; background: #2a2422; }

  .media { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
  .media li {
    display: flex; gap: 10px; align-items: center;
    padding: 8px; background: #232120; border: 1px solid #33302c; border-radius: 5px;
  }
  .media img { width: 76px; height: 46px; object-fit: cover; border-radius: 3px; flex: none; }
  .media .yt { width: 76px; height: 46px; display: grid; place-items: center; background: #000; border-radius: 3px; flex: none; font-size: 11px; color: #c8452f; }
  .media .meta { flex: 1; min-width: 0; }
  .media .fname { font-size: 12px; color: #8b837a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media input { width: 100%; margin-top: 4px; padding: 5px 8px; font-size: 13px; }
  .media button { flex: none; background: none; border: 0; color: #8b837a; font-size: 17px; cursor: pointer; padding: 4px 8px; }
  .media button:hover { color: #c8452f; }
  .warn { font-size: 12px; color: #e0a03a; margin-top: 4px; }

  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .btn {
    padding: 9px 16px; font: inherit; color: #ddd6cc;
    background: #2c2926; border: 1px solid #46413b; border-radius: 5px; cursor: pointer;
  }
  .btn:hover { border-color: #c8452f; }
  .save {
    position: fixed; bottom: 0; left: 0; width: 46%; min-width: 380px;
    padding: 14px 26px; background: #1b1a19; border-top: 1px solid #33302c; border-right: 1px solid #33302c;
    display: flex; gap: 12px; align-items: center;
  }
  .save .btn.primary { background: #c8452f; border-color: #c8452f; color: #fff; font-weight: 600; }
  .save .btn.primary:hover { background: #d9503a; }
  .savemeta { min-width: 0; line-height: 1.45; }
  #status { font-size: 13px; color: #8b837a; display: block; }
  #status.ok { color: #6fbf73; }
  #status.err { color: #e05b45; }
  #folderName { font-size: 12px; color: #6b645c; display: block; }
  .blocked { padding: 40px; line-height: 1.8; }
  .blocked code { background: #232120; padding: 2px 6px; border-radius: 3px; }
</style>
</head>
<body>

<div class="pane form">
  <h1>개발일지 글쓰기</h1>
  <p class="hint">
    왼쪽에 쓰면 오른쪽에 실제 사이트 모양으로 보입니다.<br>
    다 쓰고 아래 <b>저장</b>을 누르면 devlog.html 맨 위에 들어갑니다.
  </p>

  <label for="date">날짜</label>
  <input type="date" id="date">

  <label for="title">제목</label>
  <input type="text" id="title" placeholder="예) 동료가 절벽에서 떨어지는 문제">

  <label for="titleEn">제목 (영어) — 비워두면 한국어 제목이 양쪽에 다 나옵니다</label>
  <input type="text" id="titleEn" placeholder="Allies walking off cliffs">

  <label for="body">본문 — 한 줄 띄우면 문단이 나뉩니다</label>
  <textarea id="body" placeholder="동료 NPC에 낙사 회피를 넣었습니다.&#10;&#10;다만 직접 끌고 다니는 동안에는 걸리지 않습니다."></textarea>

  <label>사진 · GIF</label>
  <div class="drop" id="drop">
    여기로 파일을 끌어다 놓거나, 눌러서 고르세요<br>
    <small>사진은 자동으로 크기를 줄이고 WebP로 바꿉니다. GIF는 원본 그대로 들어갑니다.</small>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <label for="yt">유튜브 영상 — 주소를 붙여넣고 추가</label>
  <div class="row">
    <input type="text" id="yt" placeholder="https://www.youtube.com/watch?v=...">
    <button class="btn" id="ytAdd">추가</button>
  </div>

  <ul class="media" id="mediaList"></ul>
</div>

<div class="pane preview"><iframe id="pv" title="미리보기"></iframe></div>

<div class="save">
  <button class="btn primary" id="saveBtn">저장</button>
  <button class="btn" id="folderBtn">폴더 다시 고르기</button>
  <div class="savemeta">
    <span id="status"></span>
    <span id="folderName"></span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const media = [];            // {kind:'img'|'yt', name, blob, url, caption, bytes}
let dirHandle = null;

/* ── 저장 폴더 기억하기 (IndexedDB) ───────────────────── */
/* 폴더를 기억하는 건 편의 기능일 뿐이다. 여기가 막히거나 느려도
   저장 자체는 되어야 하므로, 실패하면 조용히 포기하고 넘어간다.
   (시크릿 모드나 쿠키 차단 설정에서 IndexedDB 가 막히면 응답이 없다) */
function db() {
  return new Promise((res, rej) => {
    let done = false;
    const fin = fn => v => { if (!done) { done = true; fn(v); } };
    const r = indexedDB.open('galmegi-write', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => fin(res)(r.result);
    r.onerror   = () => fin(rej)(r.error);
    r.onblocked = () => fin(rej)(new Error('blocked'));
    setTimeout(() => fin(rej)(new Error('timeout')), 3000);
  });
}
async function kvSet(k, v) {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const t = d.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  } catch { /* 다음에 폴더를 다시 물어볼 뿐이다 */ }
}
async function kvGet(k) {
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const t = d.transaction('kv', 'readonly');
      const q = t.objectStore('kv').get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error); t.onabort = () => rej(t.error);
    });
  } catch { return undefined; }
}

/* ── 유틸 ─────────────────────────────────────────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const kb = n => n < 1024 * 1024 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function ytId(url) {
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

/* 사진: 긴 변 1600px 으로 줄이고 WebP 로 변환.
   GIF 는 캔버스를 거치면 움직임이 사라지므로 원본을 그대로 쓴다. */
async function processImage(file) {
  if (file.type === 'image/gif') {
    return { kind: 'img', ext: 'gif', blob: file, bytes: file.size, url: URL.createObjectURL(file) };
  }
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.82));
  return { kind: 'img', ext: 'webp', blob, bytes: blob.size, url: URL.createObjectURL(blob) };
}

/* 파일 이름은 날짜 기준으로 자동 생성한다 (한글·공백 파일명은 주소에서 깨짐) */
function renameAll() {
  const d = $('#date').value || 'undated';
  let n = 0;
  media.forEach(m => { if (m.kind === 'img') m.name = d + '-' + (++n) + '.' + m.ext; });
}

/* ── 미디어 목록 ──────────────────────────────────────── */
function drawList() {
  const ul = $('#mediaList');
  ul.innerHTML = '';
  media.forEach((m, i) => {
    const li = document.createElement('li');
    const thumb = m.kind === 'img'
      ? '<img src="' + m.url + '" alt="">'
      : '<span class="yt">YouTube</span>';
    const info = m.kind === 'img'
      ? m.name + ' · ' + kb(m.bytes)
      : 'youtu.be/' + m.id;
    const warn = (m.kind === 'img' && m.bytes > 3 * 1048576)
      ? '<div class="warn">용량이 큽니다 (' + kb(m.bytes) + '). 그대로 올려도 되지만 페이지가 느려집니다.</div>' : '';
    li.innerHTML = thumb +
      '<div class="meta"><div class="fname">' + esc(info) + '</div>' +
      '<input type="text" placeholder="설명 (없으면 비워두세요)" value="' + esc(m.caption || '') + '">' + warn + '</div>' +
      '<button title="빼기">&times;</button>';
    li.querySelector('input').addEventListener('input', e => { m.caption = e.target.value; render(); });
    li.querySelector('button').addEventListener('click', () => { media.splice(i, 1); renameAll(); drawList(); render(); });
    ul.appendChild(li);
  });
}

/* ── 글 HTML 만들기 ───────────────────────────────────── */
function buildArticle(forPreview) {
  const date = $('#date').value || '2026-01-01';
  const ko = $('#title').value.trim() || '제목 없음';
  const en = $('#titleEn').value.trim();
  const shown = date.replace(/-/g, '.');

  const h2 = en
    ? '        <span class="ko">' + esc(ko) + '</span>\n        <span class="en">' + esc(en) + '</span>'
    : '        ' + esc(ko);

  const paras = $('#body').value.trim().split(/\n\s*\n/).filter(Boolean)
    .map(p => '      <p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>').join('\n');

  const blocks = media.map(m => {
    const cap = m.caption ? '\n        <figcaption>' + esc(m.caption) + '</figcaption>' : '';
    if (m.kind === 'img') {
      const src = forPreview ? m.url : 'img/' + m.name;
      return '      <figure>\n        <img src="' + src + '" alt="' + esc(m.caption || ko) + '" loading="lazy">' + cap + '\n      </figure>';
    }
    return '      <figure>\n        <div class="embed"><iframe src="https://www.youtube.com/embed/' + m.id +
           '" title="YouTube" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>' + cap + '\n      </figure>';
  }).join('\n');

  return '      <article>\n        <time datetime="' + date + '">' + shown + '</time>\n        <h2>\n' +
         h2 + '\n        </h2>\n' + [paras, blocks].filter(Boolean).join('\n') + '\n      </article>';
}

/* ── 미리보기 ─────────────────────────────────────────── */
function render() {
  $('#pv').srcdoc =
    '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">' +
    '<link rel="stylesheet" href="style.css"></head><body>' +
    '<div class="wrap"><section><div class="devlog">' + buildArticle(true) +
    '</div></section></div></body></html>';
}

/* ── 입력 연결 ────────────────────────────────────────── */
['#date', '#title', '#titleEn', '#body'].forEach(s => $(s).addEventListener('input', () => { renameAll(); drawList(); render(); }));

const drop = $('#drop');
drop.addEventListener('click', () => $('#file').click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
$('#file').addEventListener('change', e => addFiles(e.target.files));

async function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith('image/')) {
      setStatus(f.name + ' 은(는) 사진이 아닙니다. 동영상은 유튜브에 올리고 주소를 넣어주세요.', 'err');
      continue;
    }
    media.push(Object.assign(await processImage(f), { caption: '' }));
  }
  renameAll(); drawList(); render();
}

$('#ytAdd').addEventListener('click', () => {
  const id = ytId($('#yt').value.trim());
  if (!id) return setStatus('유튜브 주소를 알아볼 수 없습니다.', 'err');
  media.push({ kind: 'yt', id, caption: '' });
  $('#yt').value = '';
  setStatus(''); drawList(); render();
});

function setStatus(msg, cls) { const el = $('#status'); el.textContent = msg; el.className = cls || ''; }

/* ── 저장 ─────────────────────────────────────────────── */

/* 고른 폴더가 맞는 폴더인지(= devlog.html 이 있는지) 확인한다.
   엉뚱한 폴더를 골랐을 때 저장 도중에 알 수 없는 말로 실패하지 않도록,
   고르는 시점에 바로 잡아낸다. */
async function hasDevlog(dir) {
  try { await dir.getFileHandle('devlog.html'); return true; }
  catch { return false; }
}

function showFolder(name) {
  $('#folderName').textContent = name ? '저장 위치: ' + name : '저장 위치를 아직 안 골랐습니다';
}

async function pickFolder() {
  const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
  if (!await hasDevlog(dir)) {
    const e = new Error('"' + dir.name + '" 폴더에는 devlog.html 이 없습니다. ' +
                        '홈페이지 파일들이 들어있는 galmegi-site 폴더를 골라주세요.');
    e.friendly = true;
    throw e;
  }
  dirHandle = dir;
  await kvSet('dir', dir);
  showFolder(dir.name);
  return dir;
}

async function ensureFolder() {
  if (!dirHandle) dirHandle = await kvGet('dir');
  if (!dirHandle) return pickFolder();
  const opt = { mode: 'readwrite' };
  let granted = await dirHandle.queryPermission(opt) === 'granted';
  if (!granted) granted = await dirHandle.requestPermission(opt) === 'granted';
  // 기억해둔 폴더가 지워졌거나 옮겨졌을 수도 있으니 매번 확인한다
  if (!granted || !await hasDevlog(dirHandle)) { dirHandle = null; return pickFolder(); }
  showFolder(dirHandle.name);
  return dirHandle;
}

$('#folderBtn').addEventListener('click', async () => {
  try { await pickFolder(); setStatus('저장 위치를 지정했습니다.', 'ok'); }
  catch (e) { setStatus(e.friendly ? e.message : '취소했습니다.', e.friendly ? 'err' : ''); }
});

$('#saveBtn').addEventListener('click', async () => {
  if (!$('#title').value.trim()) return setStatus('제목을 입력해주세요.', 'err');
  try {
    setStatus('저장하는 중...');
    const dir = await ensureFolder();

    const fh = await dir.getFileHandle('devlog.html');
    let html = await (await fh.getFile()).text();
    const marker = '<div class="devlog">';
    const at = html.indexOf(marker);
    if (at < 0) return setStatus('devlog.html 에서 글이 들어갈 자리를 찾지 못했습니다.', 'err');

    // 사진을 img/ 에 쓴다
    if (media.some(m => m.kind === 'img')) {
      const imgDir = await dir.getDirectoryHandle('img', { create: true });
      for (const m of media) {
        if (m.kind !== 'img') continue;
        const w = await (await imgDir.getFileHandle(m.name, { create: true })).createWritable();
        await w.write(m.blob); await w.close();
      }
    }

    const cut = at + marker.length;
    html = html.slice(0, cut) + '\n\n' + buildArticle(false) + '\n' + html.slice(cut);
    const w = await fh.createWritable();
    await w.write(html); await w.close();

    setStatus('저장했습니다. devlog.html 을 새로고침해보세요.', 'ok');
  } catch (e) {
    if (e.friendly)               setStatus(e.message, 'err');
    else if (e.name === 'AbortError')   setStatus('취소했습니다. 저장되지 않았습니다.');
    else if (e.name === 'NotAllowedError') setStatus('파일에 쓸 권한이 없습니다. [폴더 다시 고르기] 를 눌러 galmegi-site 폴더를 다시 골라주세요.', 'err');
    else if (e.name === 'NotFoundError')   setStatus('파일을 찾지 못했습니다. 폴더가 옮겨졌을 수 있습니다. [폴더 다시 고르기] 를 눌러주세요.', 'err');
    else setStatus('저장 실패: ' + e.message, 'err');
  }
});

/* ── 시작 ─────────────────────────────────────────────── */
if (!window.showDirectoryPicker) {
  document.body.innerHTML =
    '<div class="blocked"><h1>이 브라우저에서는 저장이 안 됩니다</h1>' +
    '<p><b>Chrome</b> 또는 <b>Edge</b> 로 열어주세요. 파이어폭스·사파리는 브라우저가 파일에 직접 쓰는 기능을 지원하지 않습니다.</p>' +
    '<p>그리고 파일을 두 번 눌러서 열지 말고, <code>열기.bat</code> 을 두 번 눌러 시작해주세요.</p></div>';
} else {
  $('#date').value = new Date().toLocaleDateString('sv-SE');  // YYYY-MM-DD (현지 날짜)
  render();
  // 기억해둔 폴더가 있으면 이름만 띄워준다 (권한을 묻지는 않는다)
  kvGet('dir').then(h => showFolder(h && h.name)).catch(() => showFolder(null));
}
</script>
</body>
</html>
